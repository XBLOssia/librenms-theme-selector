# The checks every change must pass before it is merged (the two jobs below are the required checks on main).
# Nothing here needs a secret, and the token can only read the repository.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: unit (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']   # composer.json says ^8.2; LibreNMS's image runs 8.4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: zlib, mbstring, json
          tools: composer
          coverage: none

      - name: Lint PHP
        run: find src routes database tests dev resources -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Lint shell scripts
        run: |
          # Each script is checked by the shell its first line asks for (two are bash, the rest POSIX sh).
          for f in scripts/*.sh dev/*.sh tests/mutate.sh; do
            case "$(head -n 1 "$f")" in *bash*) bash -n "$f" || exit 1 ;; *) sh -n "$f" || exit 1 ;; esac
          done

      - name: composer.json is valid
        run: composer validate --strict --no-check-lock

      - name: Unit tests
        run: php tests/run.php

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: matrix.php == '8.4'
        with:
          python-version: '3.12'

      - name: Generated files are current
        if: matrix.php == '8.4'
        run: |
          python scripts/gen-token-catalog.py --check
          python scripts/gen-token-docs.py --check
          python scripts/make-clock-tower.py --check

  mutate:
    name: mutation check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: zlib, mbstring, json
          coverage: none

      # Breaks each defence in turn on a scratch copy and requires a failing test. The runner is a
      # throwaway machine, so this does not need the seal that dev/test.sh puts round it locally.
      - name: Mutation check
        run: sh tests/mutate.sh
