# RRDtool graph colours for the Clock Tower Lantern skin.
#
# Graph interiors are drawn on the server, so CSS cannot reach them; see skins/zerg/graph.conf for the long
# explanation of the two kinds of key. A skin's palette applies in the mode the skin is written for, so this
# one sets the dark chrome. Inbound is green and outbound is brass, which differ in hue and in
# lightness, so they stay apart for anyone who cannot tell colours apart.

rrdgraph_def_text_dark=-c BACK#221710 -c SHADEA#EEEEEE00 -c SHADEB#EEEEEE00 -c CANVAS#FFFFFF00 -c GRID#41301A -c MGRID#6B4A1E -c FRAME#6B4A1E -c ARROW#D4A23A
rrdgraph_def_text_color_dark=ECD9B0
graph_colours.greens=["D6E8B4","B4D88A","8FBF5A","6FA03E","55802E","3E6022"]
graph_colours.blues=["CFE6F2","9CCDE4","7DB4CF","5C97B5","437A98","2F5F7A"]
graph_colours.purples=["F1DDC0","E0BC8A","CC9A5E","B27C42","906030","6E4822"]
graph_colours.oranges=["FBE3A0","F4C75E","F0A93A","D68A1E","B36E12","8A520C"]
graph_colours.pinks=["F6D2C8","EDA897","E0836C","C5624A","A44A36","7E3626"]
graph_colours.default=["8FBF5A","7DB4CF","F0B429","E0634A","CDB27C","D4A23A"]

# Port traffic series: palest first (the 95th-percentile fill, the area fill, the outline).
graph_colours.port_in=["D6E8B4","9BCB62","7DB04A"]
graph_colours.port_out=["FBE3A0","F4C75E","D4A23A"]
