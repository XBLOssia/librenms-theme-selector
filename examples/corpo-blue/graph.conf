# Corpo Blue graph palette. Every colour comes from the skin's own palette (dark theme):
# navy-deep #00193F is the chart ground, so graphs sit on the
# panels they are in; the grid is brand-tint / border (hairlines, decorative); the axis text is
# ink-body; the arrows are stripe-orange, the same orange as the skin's ornaments.
#
# Series colours differ by hue AND lightness (blue against orange), and each is at least 3:1
# on the chart ground (brand 8.6, accent-blue 4.4, brand-fill 3.4, stripe-orange 6.4,
# stripe-yellow 12.1, accent-teal 9.6, ink-body 13.5).
rrdgraph_def_text_dark=-c BACK#00193F -c SHADEA#EEEEEE00 -c SHADEB#EEEEEE00 -c CANVAS#FFFFFF00 -c GRID#1B3A73 -c MGRID#4A5F86 -c FRAME#4A5F86 -c ARROW#F37C2F
rrdgraph_def_text_color_dark=DFE3EA

# Several series on one graph (processors, memory, ...): hues that tell apart at a glance.
graph_colours.default=["9DB8E8","F37C2F","08D8C5","FDD429","3B6CC4","DFE3EA"]
# Device traffic: inbound runs through the blues and teal, outbound through yellow and orange.
graph_colours.greens=["08D8C5","9DB8E8","0886CA","3B6CC4","DFE3EA","8EA0C2"]
graph_colours.purples=["FDD429","F37C2F","FFFFFF","C3C5CC","8EA0C2","DFE3EA"]

# Port traffic series (port_bits and 19 other graph types). Three tones each, palest first:
# the 95th-percentile max fill, the main area fill, and the outline. In is pale blue over bright
# blue, Out is yellow over orange. The outline is the area's own colour in both, kept flat like
# the rest of the skin, so a legend swatch matches the fill it labels.
graph_colours.port_in=["9DB8E8","0886CA","0886CA"]
graph_colours.port_out=["FDD429","F37C2F","F37C2F"]
