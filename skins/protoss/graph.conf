# RRDtool graph colours for the Protoss skin.
#
# Graph interiors are rendered server-side to PNG by RRDtool, so CSS cannot
# touch them. LibreNMS exposes them as config in TWO separate places:
#
#   rrdgraph_def_text_dark   the CHROME - background, grid, frame, arrows.
#                            Read by GraphParameters::graphColors().
#   graph_colours.*          the DATA SERIES ramps. Graph files pick a palette
#                            BY NAME - port graphs use 'greens' for in and
#                            'blues' for out - so retinting the named palettes
#                            retints the series.
#
# WHAT IS DELIBERATELY NOT RETINTED
# manycolours (35), psychedelic (32), rainbow (12), rainbow_stats_* (11),
# mixed (8) and varied (8) are multi-hue ON PURPOSE: they colour graphs that
# plot many series at once, and hue is what tells the series apart. Collapsing
# them into one skin hue would look consistent and be unreadable. They are left
# stock by choice, not by omission.
#
# Entry counts match the upstream defaults - a graph file walks the palette by
# index and wraps when it runs out, so a shorter ramp repeats sooner.
#
# Theme Selector applies these keys when this skin is the instance default,
# and overrides them in memory, for that one request, on the graphs of each
# user who picks this skin. Before it first overwrites a key it records
# whether the database held an override, and restores or erases accordingly
# (docs/DEPLOYMENT.md, "Graph colours"). Only rrdgraph_def_text*_dark and
# graph_colours.* keys are accepted in this file; any other key is an error.
#
# Port graph SERIES need a word of explanation. rrdgraph_def_text_dark above themes the
# chrome of every graph, port graphs included (background, grid, frame). The series are
# different: port_bits (and 19 other graph types) resolve to
# includes/html/graphs/generic_data.inc.php, which hard-codes its six series colours
# (#90B040 green in, #8080C0 lavender out) and reads no config, so graph_colours.* cannot
# reach it. The plugin recolours those six options itself, just before rrdtool draws, from
# graph_colours.port_in / port_out at the end of this file (docs/PLUGIN.md). Nothing in
# LibreNMS is edited.

rrdgraph_def_text_dark=-c BACK#0f1a2e -c SHADEA#EEEEEE00 -c SHADEB#EEEEEE00 -c CANVAS#FFFFFF00 -c GRID#1b2c47 -c MGRID#2a4570 -c FRAME#2a4570 -c ARROW#e3b341
rrdgraph_def_text_color_dark=c6d5ea
graph_colours.greens=["9CF7DC","5FE8C4","3AD6A8","2CB08A","218C6E","176851"]
graph_colours.blues=["FFE7A8","FFD478","E3B341","BC9330","95741F","6E5514"]
graph_colours.oranges=["FFEFC4","FFDC8A","F2C860","E3B341","C39830","A37D22","836216","63490D"]
graph_colours.purples=["CFE9FF","9ED8FF","3FB8F5","3196C9","25759E","1A5676"]
graph_colours.default=["B8E6FF","8AD8FF","3FB8F5","3196C9","25759E","1A5676"]
graph_colours.pinks=["FFB0C2","FF8099","FF5C7A","D43F5B","A82D44","7C1D2E"]

# --- PORT TRAFFIC SERIES -----------------------------------------------------
# Read by the plugin's own recolouring of the port series; no change to LibreNMS is
# needed (docs/PLUGIN.md). If LibreNMS ever changes the lines it matches, port graphs
# simply keep the stock green and lavender.
#
# Three tones each, palest first: the 95th-percentile max fill, the main area
# fill, and the outline. Same shape as the stock literals they replace, and
# these are indices 0, 2 and 4 of this skin's own greens/blues ramps above, so
# port graphs sit in the same palette as everything else. shield teal in, keratinous gold out.
graph_colours.port_in=["9CF7DC","3AD6A8","218C6E"]
graph_colours.port_out=["FFE7A8","E3B341","95741F"]
