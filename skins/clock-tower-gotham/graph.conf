# RRDtool graph colours for the Clock Tower Gotham skin.
#
# Graph interiors are drawn on the server, so CSS cannot reach them; see skins/zerg/graph.conf for the long
# explanation of the two kinds of key. A skin's palette applies in the mode the skin is written for, so this
# one sets the dark chrome. Inbound is green and outbound is brass, which differ in hue and in
# lightness, so they stay apart for anyone who cannot tell colours apart.

rrdgraph_def_text_dark=-c BACK#0B1426 -c SHADEA#EEEEEE00 -c SHADEB#EEEEEE00 -c CANVAS#FFFFFF00 -c GRID#1B2F52 -c MGRID#2C4676 -c FRAME#2C4676 -c ARROW#E6B82E
rrdgraph_def_text_color_dark=E8E4D2
graph_colours.greens=["D3F0DD","A6E0BC","74D49A","4DB57A","36915F","246A44"]
graph_colours.blues=["D6E6FF","A9C9FF","78B4FF","5593E6","3D74C4","2A5596"]
graph_colours.purples=["E3DCFF","C5B8F5","9F8CE6","7C69C8","5B4BA3","41357A"]
graph_colours.oranges=["FFF0B3","FFDC5E","FFB84A","E6932B","BF7118","8C510E"]
graph_colours.pinks=["FFD9D3","FFB3A8","FF7D6E","DB5A4C","AD4136","7E2D26"]
graph_colours.default=["74D49A","78B4FF","FFB84A","FF7D6E","AEBBD8","E6B82E"]

# Port traffic series: palest first (the 95th-percentile fill, the area fill, the outline).
graph_colours.port_in=["CFE3FF","8FBBFF","5C94F0"]
graph_colours.port_out=["FFF0B3","FFD84D","E6B82E"]
