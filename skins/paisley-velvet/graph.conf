# RRDtool graph colours for the Paisley Velvet skin.
#
# Graph interiors are drawn on the server, so CSS cannot reach them; see skins/zerg/graph.conf for the long
# explanation of the two kinds of key. A skin's palette applies in the mode the skin is written for, so this
# one sets the dark chrome. Inbound is violet and outbound is peach, which differ in hue and in
# lightness, so they stay apart for anyone who cannot tell colours apart.

rrdgraph_def_text_dark=-c BACK#1A0E2E -c SHADEA#EEEEEE00 -c SHADEB#EEEEEE00 -c CANVAS#FFFFFF00 -c GRID#36206A -c MGRID#4B2F82 -c FRAME#4B2F82 -c ARROW#FFD97A
rrdgraph_def_text_color_dark=F1E9FA
graph_colours.greens=["D3F0DD","A6E0BC","74D49A","4DB57A","36915F","246A44"]
graph_colours.blues=["DCE6FF","B5C9FF","8FAAF5","6B88DC","4F6AB8","374C8A"]
graph_colours.purples=["EADDFF","D0B8FF","B590FF","9466F0","7440CC","552C9A"]
graph_colours.oranges=["FFEBC9","FFD59E","FFB870","F0964A","CC7430","9A5420"]
graph_colours.pinks=["FFD9E0","FFB0C0","FF8499","E65C78","BC4260","8C2F48"]
graph_colours.default=["B590FF","FFCB8A","7EE0A8","9BB8FF","FF7A8E","E2B24A"]

# Port traffic series: palest first (the 95th-percentile fill, the area fill, the outline).
graph_colours.port_in=["E0D0FF","B590FF","9466F0"]
graph_colours.port_out=["FFEBC9","FFCB8A","F0A046"]
