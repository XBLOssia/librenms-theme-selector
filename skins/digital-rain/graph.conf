# RRDtool graph colours for the Digital Rain skin.
#
# Graph interiors are drawn on the server, so CSS cannot reach them; see skins/zerg/graph.conf for
# the long explanation of the two kinds of key. In short: rrdgraph_def_text_dark is the chrome
# (ground, grid, frame, arrows), and graph_colours.<name> are the named series ramps that graph
# files pick by name (device traffic uses `greens` for in and `purples` for out).
#
# Phosphor green on black. The series that must be told apart differ in hue AND lightness: inbound
# is green, outbound is amber (not red, which would read as an alarm), and the multi-series
# ramps lead with hues that separate at a glance. Every colour is at least 4.5:1 on the ground.
#
# Only rrdgraph_def_text*_dark and graph_colours.* keys are accepted in this file; any other key is
# an error. The ramps not set here (manycolours, psychedelic, rainbow, ...) stay stock on purpose:
# they are multi-hue by design.

rrdgraph_def_text_dark=-c BACK#010A03 -c SHADEA#EEEEEE00 -c SHADEB#EEEEEE00 -c CANVAS#FFFFFF00 -c GRID#0A2E14 -c MGRID#0F5A26 -c FRAME#0F5A26 -c ARROW#00FF41
rrdgraph_def_text_color_dark=9DFFB5
graph_colours.greens=["B8FFCB","7DFF9B","00FF41","00C832","00A027","007A1D"]
graph_colours.blues=["B8F4FF","7FE9FF","2FD6FF","00A9D6","008CB0","006B88"]
graph_colours.purples=["FFE9A8","FFD23F","FFB300","DB9A00","B07A00","8A5F00"]
graph_colours.oranges=["FFD9B0","FFB26B","FF8A1F","E07000","B85A00","8F4600"]
graph_colours.pinks=["FFC2E8","FF8AD0","FF6AD5","E049B3","B8328F","8F2470"]
graph_colours.default=["00FF41","2FD6FF","FFD23F","FF6AD5","DFFFE6","9DFFB5"]

# Port traffic series (port_bits and 19 other graph types). Three tones each, palest first: the
# 95th-percentile max fill, the main area fill, and the outline. In is green, Out is amber.
graph_colours.port_in=["B8FFCB","00FF41","00FF41"]
graph_colours.port_out=["FFE9A8","FFD23F","FFD23F"]
