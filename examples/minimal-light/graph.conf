# Graph colours for a light-mode skin. Light graphs use rrdgraph_def_text (the chrome) and
# rrdgraph_def_text_color; dark graphs use the _dark pair. The series ramps (graph_colours.*) are
# the same keys in both. A skin's palette applies to graphs drawn in the mode the skin is written for.
rrdgraph_def_text=-c BACK#F4F7F7 -c SHADEA#EEEEEE00 -c SHADEB#EEEEEE00 -c CANVAS#FFFFFF00 -c GRID#C5D6D9 -c MGRID#9FBCC2 -c FRAME#5D747C -c ARROW#5D747C
rrdgraph_def_text_color=24373D
graph_colours.greens=["BFE3CF","5DB98A","1F8A4C","176B3B","10502C","0A3820"]
graph_colours.port_in=["BFE3CF","5DB98A","1F8A4C"]
graph_colours.port_out=["BCD9F0","5FA8DC","1F78B4"]
