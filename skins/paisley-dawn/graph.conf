# RRDtool graph colours for the Paisley Dawn skin.
#
# Graph interiors are drawn on the server, so CSS cannot reach them; see skins/zerg/graph.conf for the long
# explanation of the two kinds of key. A skin's palette applies in the mode the skin is written for, so this
# one sets the light chrome. Inbound is violet and outbound is peach, which differ in hue and in
# lightness, so they stay apart for anyone who cannot tell colours apart.

rrdgraph_def_text=-c BACK#FCF9FE -c SHADEA#EEEEEE00 -c SHADEB#EEEEEE00 -c CANVAS#FFFFFF00 -c GRID#CDB8E6 -c MGRID#CDB8E6 -c FRAME#8A5CC6 -c ARROW#8A5CC6
rrdgraph_def_text_color=2B1646
graph_colours.greens=["D3E6C8","9CC58A","6AA35A","4B843F","37682E","254A20"]
graph_colours.blues=["D3DDF5","9FB4E6","6F8BD3","4C69B8","36509A","253970"]
graph_colours.purples=["E6D8F6","C9AEEB","A47ED8","8456BE","653C9C","482A74"]
graph_colours.oranges=["FBE3CC","F4C096","EA9C62","D27B3C","AC5E24","7E4318"]
graph_colours.pinks=["F6D3DC","EBA4B8","DB7592","BF4F6F","99365A","6F2542"]
graph_colours.default=["5E2EA6","B9651A","2F7A4A","3A56B0","B02A47","8A6A1E"]

# Port traffic series: palest first (the 95th-percentile fill, the area fill, the outline).
graph_colours.port_in=["D9C8F0","9A6FD0","5E2EA6"]
graph_colours.port_out=["F8DDBF","EDB07A","B9651A"]
