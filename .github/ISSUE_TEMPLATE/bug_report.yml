name: Bug report
description: Something looks wrong or does not work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a security problem, please use a private advisory instead (see the link on the issue chooser).
  - type: input
    id: plugin
    attributes:
      label: Plugin version
      description: The release tag, or the commit if you run `dev-main`.
      placeholder: v1.1.0
    validations:
      required: true
  - type: input
    id: librenms
    attributes:
      label: LibreNMS version
      placeholder: "26.9.0"
    validations:
      required: true
  - type: input
    id: skin
    attributes:
      label: Skin and mode
      description: Which skin, and whether it is the light-mode or dark-mode pick. Say if it is an uploaded skin.
      placeholder: Clock Tower Gotham, dark
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: Which page, and what you did. A screenshot helps for anything visual.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Anything from the browser console or the LibreNMS log
      render: text
