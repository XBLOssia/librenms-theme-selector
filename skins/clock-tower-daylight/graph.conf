# RRDtool graph colours for the Clock Tower Daylight skin.
#
# Graph interiors are drawn on the server, so CSS cannot reach them; see skins/zerg/graph.conf for the long
# explanation of the two kinds of key. A skin's palette applies in the mode the skin is written for, so this
# one sets the light chrome. Inbound is green and outbound is brass, which differ in hue and in
# lightness, so they stay apart for anyone who cannot tell colours apart.

rrdgraph_def_text=-c BACK#F8F1E1 -c SHADEA#EEEEEE00 -c SHADEB#EEEEEE00 -c CANVAS#FFFFFF00 -c GRID#C9AD7C -c MGRID#C9AD7C -c FRAME#A37B3A -c ARROW#A37B3A
rrdgraph_def_text_color=3B2A1C
graph_colours.greens=["D5E4BC","9CBF6A","6F9A3C","4F7A2A","3D6A28","2A4A1A"]
graph_colours.blues=["CFE0EA","8FB8CE","5C93B2","3F7696","2B5F7C","1D4358"]
graph_colours.purples=["E4D3C0","C9A98A","A8805E","8A6240","6E4A2C","523620"]
graph_colours.oranges=["F2D9A8","E2B25C","C98A2A","A56A14","8A5A14","66410C"]
graph_colours.pinks=["EBCFC4","D6A28E","BC7B63","9E5A44","8A432E","672F1F"]
graph_colours.default=["3D6A28","2B5F7C","9A6200","A02E1E","664D34","8A5A14"]

# Port traffic series: palest first (the 95th-percentile fill, the area fill, the outline).
graph_colours.port_in=["CFE0B4","7BA24A","3D6A28"]
graph_colours.port_out=["E8C98A","C99A3C","8A5A14"]
